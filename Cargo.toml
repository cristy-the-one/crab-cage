[package]
name = "crab-cage"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["Marius"]
description = "Offline workbench that evolves Rust process controllers and runs them in the lust sandbox."
readme = "README.md"
publish = false

[[bin]]
name = "crab-cage"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.23", features = ["derive"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
